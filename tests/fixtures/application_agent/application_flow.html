<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Controlled application fixture</title></head>
  <body>
    <main>
      <form id="application" action="/confirmation" method="post" enctype="multipart/form-data">
        <label>First name <input name="first_name" required></label>
        <label>Last name <input name="last_name" required></label>
        <label>Email <input name="email" type="email" required></label>
        <label>Phone <input name="phone" type="tel" required></label>
        <label>Resume <input name="resume" type="file" accept="application/pdf" required></label>
        <label>Work authorization
          <select name="work_authorization" required><option>Yes</option><option>No</option></select>
        </label>
        <fieldset><legend>Will you require sponsorship?</legend>
          <label><input type="radio" name="sponsorship" value="Yes">Yes</label>
          <label><input type="radio" name="sponsorship" value="No">No</label>
        </fieldset>
        <label>Why this role?<textarea name="why_role" maxlength="500"></textarea></label>
        <label>Education
          <select name="degree"><option>BS</option><option>MS</option></select>
        </label>
        <label><input type="checkbox" name="acknowledge" required> I confirm the information is accurate</label>
        <button type="submit">Submit application</button>
      </form>
      <section id="verification" hidden>
        <h1>Verify your email</h1><p>Enter the code we sent to continue.</p>
      </section>
      <section id="confirmation" hidden><h1>Thank you for applying</h1></section>
    </main>
  </body>
</html>
