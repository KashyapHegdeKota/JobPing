name: Set up test environment
description: Install a locked Poetry environment for one Python version
inputs:
  python-version:
    description: Python version to test
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Poetry
      shell: bash
      run: python -m pip install "poetry>=2.0,<3.0"
    - name: Use project virtual environment
      shell: bash
      run: poetry config virtualenvs.in-project true
    - uses: actions/cache@v4
      with:
        path: .venv
        key: test-env-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('poetry.lock') }}
    - name: Install locked dependencies
      shell: bash
      run: poetry install --no-interaction
    - name: Validate lock file
      shell: bash
      run: poetry check --lock
