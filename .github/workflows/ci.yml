name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - test/ci-overhaul
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
    env:
      PYTHONHASHSEED: "17"
      NOTIFICATIONS_SEND_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up test environment
        uses: ./.github/actions/setup-test-environment
        with:
          python-version: ${{ matrix.python }}

      - name: Run Ruff
        run: poetry run ruff check .

      - name: Check formatting
        run: poetry run black --check .

      - name: Run tests
        run: >-
          poetry run pytest -q --strict-markers --strict-config --basetemp=.pytest-tmp
          --junitxml=test-results/quality.xml --cov=app --cov-branch
          --cov-report=term-missing:skip-covered --cov-report=xml --cov-report=html

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            test-results/
            coverage.xml
            htmlcov/
          retention-days: 14

  browser:
    name: Controlled browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_BROWSER_E2E: "1"
      NOTIFICATIONS_SEND_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-test-environment
        with:
          python-version: "3.12"
      - name: Install controlled browser runtime
        run: poetry run playwright install --with-deps chromium
      - name: Run controlled browser acceptance tests
        run: >-
          poetry run pytest tests/e2e tests/applicants -m browser_e2e -q
          --strict-markers --strict-config --basetemp=.pytest-tmp
          --junitxml=test-results/browser.xml
      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 14

  services:
    name: PostgreSQL Redis MCP acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobping
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: jobping_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobping -d jobping_test_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      RUN_SERVICE_INTEGRATION: "1"
      JOBPING_TEST_DATABASE_URL: postgresql+psycopg://jobping:test-only-password@127.0.0.1:5432/jobping_test_ci
      JOBPING_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      NOTIFICATIONS_SEND_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-test-environment
        with:
          python-version: "3.12"
      - name: Run isolated services and MCP acceptance tests
        run: >-
          poetry run pytest tests/services -q --strict-markers --strict-config
          --basetemp=.pytest-tmp --junitxml=test-results/services.xml
      - name: Upload service test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-test-results
          path: test-results/
          retention-days: 14

  deployment-checks:
    name: Deployment failure simulation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-test-environment
        with:
          python-version: "3.12"
      - run: shellcheck deploy/scripts/*.sh deploy/backup.sh
      - run: poetry run pytest tests/deployment -q --basetemp=.pytest-tmp
      - name: Validate deployment Compose
        run: |
          touch /tmp/jobping-ci.env
          export JOBPING_ENV_FILE=/tmp/jobping-ci.env
          export JOBPING_IMAGE=ghcr.io/kashyaphegdekota/jobping:${GITHUB_SHA}
          export JOBPING_COLOR=blue JOBPING_PORT=8001
          docker compose -p jobping-blue -f deploy/compose.api.yml config --quiet
          docker compose -p jobping-workers -f deploy/compose.workers.yml --profile notifications --profile evidence config --quiet
          JOBPING_RENDERER_IMAGE=sha256:$(printf 'a%.0s' {1..64}) docker compose -f deploy/compose.evidence.yml config --quiet
          docker compose -f deploy/compose.infra.yml config --quiet

  production-image:
    name: Build and verify production ARM64 image
    needs: [quality, browser, services, deployment-checks]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build once at the tested commit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          load: true
          provenance: false
          tags: ghcr.io/kashyaphegdekota/jobping:${{ github.sha }}
          build-args: APP_GIT_SHA=${{ github.sha }}
      - name: Verify the exact image against disposable PostgreSQL/Redis
        run: bash deploy/scripts/check-image.sh "ghcr.io/kashyaphegdekota/jobping:$GITHUB_SHA" "$GITHUB_SHA"
      - name: Publish verified image
        id: publish
        run: |
          image="ghcr.io/kashyaphegdekota/jobping:$GITHUB_SHA"
          docker push "$image"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          echo "digest=${reference##*@}" >> "$GITHUB_OUTPUT"

  production-deploy:
    name: Blue-green production deployment
    needs: [quality, browser, services, deployment-checks, production-image]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned SSH credentials
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/jobping-deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/jobping-deploy ~/.ssh/known_hosts
      - name: Transfer exact release and deploy its digest
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PORT: ${{ secrets.VM_SSH_PORT || '22' }}
          DIGEST: ${{ needs.production-image.outputs.digest }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$VM_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$VM_USER" =~ ^[a-z_][a-z0-9_-]*$ && "$VM_PORT" =~ ^[0-9]+$ ]]
          tar -czf /tmp/release.tar.gz deploy
          { printf '%s\n' "$REGISTRY_TOKEN"; cat /tmp/release.tar.gz; } |
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 \
              -i ~/.ssh/jobping-deploy -p "$VM_PORT" "$VM_USER@$VM_HOST" \
              "deploy $GITHUB_SHA $DIGEST" | tee /tmp/deploy.log
      - name: Deployment summary
        if: always()
        env:
          RESULT: ${{ job.status }}
          DIGEST: ${{ needs.production-image.outputs.digest }}
        run: |
          { echo "Production deployment: $RESULT"; echo "Commit: $GITHUB_SHA"; echo "Image digest: $DIGEST";
            if [[ -f /tmp/deploy.log ]]; then tail -15 /tmp/deploy.log; fi; } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove credentials
        if: always()
        run: rm -f ~/.ssh/jobping-deploy /tmp/release.tar.gz
