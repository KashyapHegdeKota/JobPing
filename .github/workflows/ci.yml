name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - test/ci-overhaul
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
    env:
      PYTHONHASHSEED: "17"
      NOTIFICATIONS_SEND_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Poetry
        run: python -m pip install "poetry>=2.0,<3.0"

      - name: Cache Poetry environment
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py${{ matrix.python }}-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Validate lock file
        run: poetry check --lock

      - name: Run Ruff
        run: poetry run ruff check .

      - name: Check formatting
        run: poetry run black --check .

      - name: Run tests
        run: poetry run pytest -q --strict-markers --strict-config --basetemp=.pytest-tmp
