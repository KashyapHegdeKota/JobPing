[project]
name = "jobping"
version = "0.1.0"
description = "Low-latency job aggregation and discovery engine for internships and new-grad roles."
authors = [{ name = "JobPing Contributors" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = ["sqlalchemy (>=2.0,<3.0)", "alembic (>=1.16,<2.0)", "psycopg[binary] (>=3.2,<4.0)", "pydantic (>=2.11,<3)", "redis (>=6.2,<7.0)", "httpx (>=0.28,<1.0)", "typer (>=0.16,<1.0)", "playwright (>=1.55,<2)", "playwright-stealth (>=2,<3)", "tenacity (>=9.1,<10)", "fake-useragent (>=2.2,<3)"]

[tool.poetry]
packages = [{ include = "app" }]

[dependency-groups]
dev = ["black>=26.5.1,<27", "ruff>=0.12,<0.16", "pytest (>=8.4,<10)", "pytest-asyncio (>=1.1,<2)", "aiosqlite (>=0.21,<1.0)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["browser_e2e: requires RUN_BROWSER_E2E=1 and a locally installed Chromium binary"]
