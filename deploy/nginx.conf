map $http_upgrade $jobping_connection_upgrade {
    default upgrade;
    '' close;
}

# Install these two includes under /etc/nginx/jobping/ before activating this site.
include /etc/nginx/jobping/nginx-request-limits.conf;
include /etc/nginx/jobping/upstream.conf;

server {
    listen 80;
    server_name api.jobping.website;
    access_log /var/log/nginx/jobping-access.log combined;
    error_log /var/log/nginx/jobping-error.log;
    limit_req_dry_run on;
    limit_conn_dry_run on;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req zone=jobping_ip burst=50 nodelay;
    limit_req zone=jobping_all burst=100 nodelay;
    limit_conn jobping_connections 50;
    limit_conn jobping_capacity 300;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    error_page 429 = @jobping_throttled;

    location = /api/v1/health { return 404; }

    location @jobping_throttled {
        default_type application/json;
        add_header Retry-After 5 always;
        add_header Cache-Control no-store always;
        add_header Access-Control-Allow-Origin $jobping_allowed_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Expose-Headers Retry-After always;
        add_header Vary Origin always;
        return 429 '{"detail":"Too many requests. Please wait and try again.","code":"rate_limited"}';
    }

    location / {
        proxy_pass http://jobping_backend;
        proxy_http_version 1.1;
        include /etc/nginx/jobping/nginx-proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jobping_connection_upgrade;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    # Streams retain long read timeouts, with separate concurrent admission in Redis.
    location ~ ^/api/v1/(ws/live|sse/feed)$ {
        proxy_pass http://jobping_backend;
        proxy_http_version 1.1;
        include /etc/nginx/jobping/nginx-proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jobping_connection_upgrade;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        client_max_body_size 1m;
    }
}
