map $http_upgrade $jobping_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name api.jobping.website;
    access_log /var/log/nginx/jobping-access.log combined;
    error_log /var/log/nginx/jobping-error.log;

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jobping_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        client_max_body_size 1m;
    }
}
