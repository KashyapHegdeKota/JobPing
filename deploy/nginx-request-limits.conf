# Included from nginx.conf inside http {}, before the JobPing server block.
# Shadow first. Change dry_run in the server block after traffic review.
limit_req_zone $binary_remote_addr zone=jobping_ip:10m rate=10r/s;
limit_req_zone $server_name zone=jobping_all:1m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=jobping_connections:10m;
limit_conn_zone $server_name zone=jobping_capacity:1m;

map $http_origin $jobping_allowed_origin {
    default '';
    'https://jobping.website' $http_origin;
    'https://www.jobping.website' $http_origin;
}
